 <!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>
		Sudoku
	</title>
	<link rel="stylesheet" href="../stylesheet/stylesheet.css">
	<style>
		tr:nth-child(even) { /* counteract stylesheet */
			color: inherit;
			background-color: inherit;
		}
		.calculated {
			border-width: 0;
			color: #00CCCC;
		}
		.entered {
			border-width: 0;
			color: #FFFF00;
		}
		.mainCell {
			padding: 0.5em 0.5em 0.5em 1.5em;
		}
	</style>
	<script src="./javascript/sudoku.js"></script>
</head>
<body onload="onload();">
    <h2>
        Sudoku
    </h2>
	<div class="mainCell">
		<label for="gridType">
			Value Range:
		</label>
		<select id="gridType" onChange="changeGrid();">
			<option value="33N" selected>1..9</option>
			<option value="33A">A..I</option>
			<option value="44N">1..G</option>
			<option value="44A">A..P</option>
			<option value="45N">1..K</option>
			<option value="45A">A..T</option>
		</select>
	</div>
	<div class="mainCell">
		<table id="table">
			<tbody id="rowRepeater">
				<tr id="colRepeater">
					<!-- td style="${y.borderStyle}">
						<input type="text" id="${y.id}" 
							class="calculated" size="1" style="width: 0.5em"
							onkeyup="cleanseInput('${y.id}', ${y.i}, ${y.j});" />
					</td -->
				</tr>
			</tbody>
		</table>
	</div>
	<div class="mainCell">
		<button onclick="back();">
			Back
		</button>
	</div>
</body>
</html>
