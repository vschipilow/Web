<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>
		New Strong Password
	</title>
	<link rel="stylesheet" href="../stylesheet/stylesheet.css">
	<style>
        tr:nth-child(even) {
            color: inherit;
            background-color: inherit;
        }
        td {
            padding: var(--padding);
        }
		.password {
			font-family: 'Courier New';
			font-size: 2em;
		}
	</style>
	<script>
		function onload() {
			newPassword();
		}
		
		function copy() {
			navigator.clipboard.writeText(get('p').innerHTML);
			get('label').innerHTML = '<br>Copied to Clipboard<br>';
		}
		
		function get(id) {
			return window.document.getElementById(id);
		}
		
		function newPassword() {
			const result = [];
			get('label').innerHTML = '';
			const lowerCaseChars = 'abcdefghijkmnopqrstuvwxyz'; // no 'l'
			const upperCaseChars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';  // no 'IO'
			const numericChars = '23456789';                    // no '01''
			const specialChars = '@#$%&';
			for (let i = 0; i < 9; i++) {
				result.push(randmChar(lowerCaseChars));
			}
			insertChar(result, upperCaseChars);
			insertChar(result, numericChars);
			insertChar(result, specialChars);
			get('p').innerHTML = result.join('');
		}
		
		function randm(limit) {
			return Math.floor(Math.random() * limit);
		}
		
		function randmChar(chars) {
			return chars[randm(chars.length)];
		}

		function insertChar (result, fromWhere) {
			result.splice(1 + randm(result.length - 1), 0, randmChar(fromWhere));
		}
	</script>
</head>
<body onload="onload();">
	<h2>
		New&nbsp;Strong&nbsp;Password
	</h2>
    <table>
        <tr>
            <td>
                <a href="javascript:newPassword();">
					Again
				</a>
            </td>
        </tr>
        <tr>
            <td>
                <label id="p" class="password">
                </label>
            </td>
        </tr>
		<tr>
			<td>
                <a href="javascript:copy();">
					Copy
				</a>
            </td>
        </tr>
        <tr>
            <td>
                <label id="label">
                </label>
            </td>
        </tr>
    </table>
</body>
</html>
